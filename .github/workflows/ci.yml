name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./pkg)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race -count=1 ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="acestep_${GOOS}_${GOARCH}"
          case "$GOOS" in
            windows) out="$out.exe" ;;
          esac
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/acestep
          ls -la "$out"

  # The engine is a C++ project, so the Go build must not depend on a C
  # toolchain. Verify the binary is genuinely static and dependency-free.
  static:
    name: static binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o acestep ./cmd/acestep
      - name: Check linkage
        run: |
          if ldd ./acestep 2>&1 | grep -v "not a dynamic executable"; then
            echo "binary is dynamically linked; it would fail on a bare target"
            exit 1
          fi
      - name: Smoke test
        run: |
          ./acestep version --short
          ./acestep generate --help > /dev/null
          ./acestep setup --list-presets > /dev/null
          ./acestep models presets > /dev/null
          # doctor is expected to fail on a runner with no models installed.
          ./acestep doctor > /dev/null 2>&1 || true
